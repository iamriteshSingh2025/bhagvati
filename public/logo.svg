<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="100%" stop-color="#4a0404" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#800000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="94" fill="url(#gradMaroon)" stroke="url(#gradGold)" stroke-width="6" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4,4" />
  
  <!-- Aura glow -->
  <circle cx="100" cy="92" r="55" fill="url(#sunGlow)" />

  <!-- Temple Kalash & Trishul Symbolism -->
  <!-- Trishul Central Shaft -->
  <path d="M100 32 L100 135" stroke="url(#gradGold)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Trishul Center Spear -->
  <path d="M100 22 L107 42 L93 42 Z" fill="url(#gradGold)" />
  
  <!-- Trishul Left & Right Prongs -->
  <path d="M80 44 C80 68 95 76 100 78 C105 76 120 68 120 44" fill="none" stroke="url(#gradGold)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M78 40 L84 50 L73 48 Z" fill="url(#gradGold)" />
  <path d="M122 40 L127 48 L116 50 Z" fill="url(#gradGold)" />

  <!-- Sacred Tilak / Bindi (Maa Vindhyavasini) -->
  <path d="M91 90 Q100 102 109 90 Q100 115 91 90 Z" fill="#EF4444" stroke="#F59E0B" stroke-width="1" />
  <circle cx="100" cy="93" r="3.5" fill="#FDE68A" />

  <!-- Holy Lotus Base -->
  <g fill="url(#gradGold)" stroke="#92400E" stroke-width="0.8">
    <!-- Center petal -->
    <path d="M100 120 C95 135 95 145 100 152 C105 145 105 135 100 120 Z" />
    <!-- Left petal 1 -->
    <path d="M96 126 C82 135 80 148 94 153 C96 145 96 135 96 126 Z" />
    <!-- Right petal 1 -->
    <path d="M104 126 C118 135 120 148 106 153 C104 145 104 135 104 126 Z" />
    <!-- Left outer petal -->
    <path d="M88 134 C72 142 68 152 86 156 C92 150 94 142 88 134 Z" />
    <!-- Right outer petal -->
    <path d="M112 134 C128 142 132 152 114 156 C108 150 106 142 112 134 Z" />
  </g>

  <!-- Base Arch / Platform -->
  <path d="M55 160 Q100 152 145 160 L150 166 Q100 158 50 166 Z" fill="url(#gradGold)" />
</svg>
